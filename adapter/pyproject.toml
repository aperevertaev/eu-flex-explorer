[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "euflex-explorer-adapter"
version = "0.1.0"
description = "Adapter between the EU-Flex model and EU-Flex Explorer: config overlays, run invocation, NetCDF to Parquet export."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "xarray>=2024.10",   # DataTree support (xr.open_datatree)
    "netCDF4",
    "h5netcdf",
    "pandas>=2.1",
    "pyarrow>=15",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
euflex-export = "euflex_adapter.export:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set so CI doesn't break when ruff changes its defaults.
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["euflex_adapter"]
