name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "./adapter[dev]"
      - run: ruff check adapter && ruff format --check adapter
      - run: pytest adapter/tests -q
